<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métré BTP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: bande projets fixe à gauche, zone de travail à droite (bande repliée en haut sur mobile)
   Thème volontairement clair uniquement : dégradés de blanc */
:root{
  --white:#ffffff; --w1:#f7f8fa; --w2:#eef0f4; --w3:#e3e7ee;
  --side-ink:#1c2530; --side-muted:#7a8591; --side-hover:rgba(255,255,255,.9); --side-line:#dde2e9;
  --ink:#1c2530; --muted:#6a7580; --accent:#2447a8; --accent-soft:#3a5fc4;
  --accent-tint:#eaf0fc; --gold:#c48a0a; --danger:#b3261e; --danger-bg:#fbeceb;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--w1);background-image:radial-gradient(ellipse 80% 60% at 70% 0%,var(--white) 0%,transparent 70%),linear-gradient(160deg,var(--white) 0%,var(--w1) 45%,var(--w2) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--f)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.app.has-p{grid-template-columns:260px 240px minmax(0,1fr)}
/* Bandeau projets réduit en barre fine quand on travaille dans un projet */
.app.has-p.folded{grid-template-columns:48px 240px minmax(0,1fr)}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-right:10px}
.fold{display:none;opacity:.7}
.app.has-p .fold{display:grid}
.fold:hover{color:var(--accent);background:var(--w2)}
.rail{display:none;flex-direction:column;align-items:center;gap:12px;background:none;border:0;cursor:pointer;color:var(--side-muted);padding:4px 0;width:100%;height:100%}
.rail svg{width:18px;height:18px}
.rail span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.rail:hover{color:var(--accent)}
.app.has-p.folded .side1{padding-block:14px}
.app.has-p.folded .side1 > :not(.rail):not(.rail-sync){display:none}
.app.has-p.folded .rail{display:flex;flex:1;height:auto}
.rail-sync{display:none;justify-content:center;background:none;border:0;cursor:pointer;color:var(--side-muted);padding:8px 0;width:100%}
.rail-sync svg{width:18px;height:18px}
.rail-sync:hover{color:var(--accent)}
.rail-sync.on{color:#2e7d4f}.rail-sync.bad{color:var(--danger)}
.app.has-p.folded .rail-sync{display:flex}
.list .ren:hover{color:var(--accent);background:var(--w2)}
.list li.editing{background:var(--white);box-shadow:inset 3px 0 0 var(--accent);padding:4px}
.list li.editing input{flex:1;min-width:0;border:1px solid var(--accent);border-radius:4px;padding:6px 8px;background:var(--white);outline:none}
/* Deuxième bandeau : travaux du projet ouvert */
.side2{background:linear-gradient(180deg,var(--w1) 0%,var(--white) 50%,var(--w2) 100%);box-shadow:4px 0 18px rgba(28,37,48,.04)}
.side2[hidden]{display:none}
.side2 .eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding-inline:18px}
.side2 .pname{margin:2px 0 0;padding-inline:18px;font-stretch:85%;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side{background:linear-gradient(180deg,var(--white) 0%,var(--w2) 60%,var(--w3) 100%);border-right:1px solid var(--side-line);box-shadow:4px 0 24px rgba(28,37,48,.05);color:var(--side-ink);display:flex;flex-direction:column;min-height:0;padding-block:18px}
.side h1{font-stretch:72%;font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;padding-inline:18px}
.label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:22px 18px 8px}
.list{list-style:none;margin:0;padding:0 8px;overflow:auto;flex:1;min-height:0}
.list li{display:flex;align-items:center;gap:2px;border-radius:5px;margin-bottom:2px}
.list li:hover{background:var(--side-hover)}
.list li.cur{background:linear-gradient(90deg,var(--white),var(--w1));box-shadow:inset 3px 0 0 var(--accent),0 1px 4px rgba(28,37,48,.08)}
.list .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:9px 6px 9px 12px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{flex:none;width:28px;height:28px;display:grid;place-items:center;background:none;border:0;border-radius:4px;cursor:pointer;color:var(--side-muted);opacity:.35;transition:opacity .15s,color .15s}
.list li:hover .ico,.ico:focus-visible{opacity:1}
.ico svg{width:16px;height:16px}
.fav.on{color:var(--gold);opacity:1}
.fav:hover{color:var(--gold)}
.del:hover{color:var(--danger);background:var(--danger-bg)}
.list li.confirm{background:var(--danger-bg);box-shadow:none;padding:6px 8px 6px 12px;flex-wrap:wrap}
.confirm span{flex:1 1 100%;font-size:13px;color:var(--danger);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.confirm .row{display:flex;gap:6px;margin-top:6px}
.sm{border:1px solid var(--side-line);background:var(--white);border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer}
.sm.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.sep{height:1px;background:var(--side-line);margin:6px 10px;list-style:none}
@media (hover:none){.ico{opacity:.7}}
.none{color:var(--side-muted);font-size:13px;padding:6px 10px}
.new{padding:12px 16px 0;border-top:1px solid var(--side-line);margin-top:8px}
.new form{display:flex;flex-direction:column;gap:8px}
.new input{background:var(--white);border:1px solid var(--side-line);border-radius:5px;padding:8px 10px;color:var(--side-ink)}
.new input:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:5px;padding:9px 12px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accent-soft)}

main{padding-inline:32px;padding-block:32px;min-width:0}
main h2{font-stretch:85%;font-size:28px;margin:0;text-wrap:balance}
main p{color:var(--muted);margin:6px 0 0}

.plan{margin-top:24px;background:linear-gradient(170deg,var(--white) 0%,var(--w1) 70%,var(--w2) 100%);border:1px solid var(--side-line);border-radius:8px;box-shadow:0 2px 14px rgba(28,37,48,.06);padding:18px}
.plan-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.plan-h h3{margin:0;font-stretch:80%;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.plan-h small{color:var(--muted);font-size:12px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:220px;border:2px dashed var(--w3);border-radius:6px;background:rgba(255,255,255,.6);text-align:center;padding:24px 16px;cursor:pointer;transition:border-color .15s,background .15s;color:var(--muted)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--white);color:var(--accent)}
.drop svg{width:34px;height:34px}
.drop b{color:var(--ink);font-size:15px}
.drop.over b{color:var(--accent)}
.err{color:var(--danger);font-size:13px;margin-top:8px}
/* Synchronisation en ligne */
.sync{margin-top:auto;padding:12px 16px 0}
.sync-btn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px dashed var(--side-line);border-radius:5px;padding:8px 10px;color:var(--side-muted);font-size:12.5px;cursor:pointer;text-align:left}
.sync-btn svg{flex:none;width:16px;height:16px}
.sync-btn:hover{border-color:var(--accent);color:var(--accent)}
.sync-btn.on{border-style:solid;color:var(--side-ink)}
.sync-btn.on svg{color:#2e7d4f}
.sync-btn.bad svg{color:var(--danger)}
.sync-dlg{border:1px solid var(--side-line);border-radius:8px;padding:0;width:min(420px,calc(100vw - 32px));box-shadow:0 10px 40px rgba(28,37,48,.25);color:var(--ink)}
.sync-dlg::backdrop{background:rgba(28,37,48,.35)}
.sync-f{display:flex;flex-direction:column;gap:12px;padding:20px}
.sync-f h3{margin:0;font-size:17px}
.sync-f p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.sync-f label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}
.sync-f input{font:inherit;font-weight:400;border:1px solid var(--side-line);border-radius:5px;padding:8px 10px}
.sync-f input:focus{outline:none;border-color:var(--accent)}
.sync-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync-a .sm{padding:8px 12px;font-size:13px}
.nowork{margin-top:24px;padding:28px 20px;border:2px dashed var(--w3);border-radius:8px;background:rgba(255,255,255,.6);color:var(--muted);text-align:center;max-width:62ch}

/* Un encadré par plan, sous « Plan de base » */
/* Chaque plan : bandeau pleine largeur, puis aperçu à gauche et légende à droite */
.boxes{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:18px}
.box-body{display:grid;grid-template-columns:minmax(0,1fr)}   /* aperçu sur toute la largeur, légende dessous */
.pane{display:flex;flex-direction:column;min-width:0}
.pane.legend{border-top:1px solid var(--side-line)}
.leg-view .recap,.leg-view .leg-crop{display:none}   /* récapitulatif masqué : la sélection se fait dans « Légende automatique » */
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--side-line);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-height:41px}
.pane-h b{font-weight:700;color:var(--ink)}
/* Flèche pour replier / déplier une partie (Calques, Légende manuelle, Légende automatique, Structure) */
.sfold{flex:none;width:20px;height:20px;margin:0 -2px 0 -6px;display:grid;place-items:center;border:0;background:none;border-radius:4px;color:var(--muted);cursor:pointer;padding:0}
.sfold:hover{background:var(--w2);color:var(--ink)}
.sfold svg{width:14px;height:14px;transition:transform .15s}
.fold-off .sfold svg{transform:rotate(-90deg)}
.fold-off>:not(.pane-h):not(.ocg-h){display:none!important}
.fold-off>.pane-h,.fold-off>.ocg-h{border-bottom:0}
.pane-h .leg-page{flex:1;text-transform:none;letter-spacing:0;font-size:12px}
.pane-h .sm{text-transform:none;letter-spacing:0;color:var(--ink)}
.pane-h .sm:hover{border-color:var(--accent);color:var(--accent)}
.leg-view{flex:1;background:var(--white);padding:12px 14px;min-height:160px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.sub-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub-h b{color:var(--ink);font-weight:700}
.recap-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sel-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;font-size:12.5px;color:var(--muted)}
.sel-bar .sel-info{flex:1;min-width:0}
.sel-bar .sm:hover{border-color:var(--accent);color:var(--accent)}
.recap-list .ctr{width:96px;accent-color:var(--accent);cursor:ew-resize;margin:0}
.recap-list .ctr[hidden],.ctr-l[hidden]{display:none}
.mk{display:inline-flex;align-items:center;gap:6px;flex:1;min-width:0;color:var(--ink);cursor:pointer}
.mk input{accent-color:var(--accent);margin:0}
.struct{border-top:1px solid var(--side-line)}
.struct-list{list-style:none;margin:0;padding:8px 14px 12px;background:var(--white);display:flex;flex-direction:column}
.struct-list li{padding:10px 0;border-bottom:1px solid var(--w2)}
.struct-list .zh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;align-items:center}
.layers{display:flex;flex-direction:column;gap:6px;margin:8px 0 0 28px}
.layer{display:grid;grid-template-columns:18px minmax(0,1fr) auto 90px 28px;gap:8px;align-items:center;font-size:13px}
.layer .ln{color:var(--muted);font-size:12px;text-align:right}
.layer input{border:1px solid var(--side-line);border-radius:4px;padding:5px 8px;background:var(--white);min-width:0}
.layer input:focus{border-color:var(--accent);outline:none}
.l-ep{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.l-ep input{width:64px;text-align:right}
.l-vol{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.layer .ico{opacity:.6}
.zf{display:flex;align-items:center;gap:10px;margin:8px 0 0 28px;font-size:12.5px}
.zf .add-l:hover{border-color:var(--accent);color:var(--accent)}
.zf .vt{flex:1;text-align:right;font-weight:700;color:var(--ink)}
.struct-list li:last-child{border-bottom:0}
.struct-list li.msg{display:block;color:var(--muted);font-size:13px;border:0}
.struct-list .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.struct-list .uq{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.excl-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--side-line);font-size:12.5px;color:var(--muted)}
.excl-bar[hidden]{display:none}
/* Geler les calques : plan en plein écran, liste des calques sur le côté */
.ocg-btn[hidden]{display:none}
.ocg-bar{display:none;flex-direction:column;border-top:1px solid var(--side-line);background:var(--w1);font-size:13px}
.pane.ocg-on>.ocg-bar{display:flex}
.pane:not(.full).ocg-on>.ocg-bar .ocg-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));max-height:240px;overflow:auto}
.ocg-bar .ocg-f{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--side-line)}
.ocg-bar .ocg-f input{flex:1;min-width:120px;border:1px solid var(--side-line);border-radius:4px;padding:4px 8px;font:inherit;font-size:12.5px;background:var(--white)}
.ocg-bar .sw{width:10px;height:10px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.2)}
.ocg-bar .ocg-only{margin-left:auto;border:0;background:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:0 2px;visibility:hidden}
.ocg-bar label:hover .ocg-only{visibility:visible}
.ocg-bar .ocg-none{padding:8px 12px;color:var(--muted)}
.pane.full.ocg-on{display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:auto minmax(0,1fr)}
.pane.full.ocg-on>.pane-h{grid-column:1/-1}
.pane.full.ocg-on>:not(.pane-h):not(.ocg-bar){grid-column:1}
.pane.full.ocg-on>.view{grid-row:2;height:100%}
.pane.full.ocg-on>.ocg-bar{grid-column:2;border-top:0;grid-row:2/span 4;min-height:0;overflow:auto;border-left:1px solid var(--side-line);background:var(--w1);font-size:13px}
.ocg-bar .ocg-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--side-line);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ocg-bar .ocg-h b{flex:1;color:var(--ink)}
.ocg-bar .ocg-h .sm{text-transform:none;letter-spacing:0}
.ocg-bar label{display:flex;align-items:center;gap:8px;padding:6px 12px;color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.ocg-bar label:hover{background:var(--w2)}
.ocg-bar label.off{color:var(--muted);text-decoration:line-through}
@media (max-width:720px){.pane.full.ocg-on{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 35vh}.pane.full.ocg-on>.ocg-bar{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--side-line)}}
.excl-bar .chip{color:var(--danger);border-color:#e7b9b5;background:var(--danger-bg)}
.excl-bar .chip:hover{border-color:var(--danger)}
.man-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.man-list li{display:grid;grid-template-columns:18px minmax(0,1fr) auto 28px;column-gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--w2)}
.man-list li.msg{display:block;border:0;color:var(--muted);font-size:13px}
.man-list .lab{min-width:0;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 6px;font-size:13.5px;font-weight:600}
.man-list .lab:hover{border-color:var(--side-line)}
.man-list .lab:focus{border-color:var(--accent);background:var(--white);outline:none}
.man-list .uq{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctr-l{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.recap-list .tools{display:flex;align-items:center;gap:6px}
.recap-list .tools .sm{padding:2px 8px;font-size:11.5px}
.sws{display:flex;gap:2px;cursor:pointer;flex-wrap:wrap;max-width:62px}
.grp .sws .sw{width:12px;height:18px}
.grp .lab{font-style:normal}
.sm.primary-sm{background:var(--accent);border-color:var(--accent);color:#fff}
.sm.primary-sm:hover{background:var(--accent-soft);color:#fff!important}
.recap-list li{display:grid;grid-template-columns:18px auto minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:6px 8px;margin-inline:-8px;border-radius:5px;border-bottom:1px solid var(--w2)}
.recap-list li.on{background:var(--accent-tint);border-bottom-color:transparent;box-shadow:inset 3px 0 0 var(--accent)}
.recap-list li.msg{display:block;border:0;color:var(--muted);font-size:13px;margin:0;padding:6px 0}
.recap-list .pick{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.sw{width:18px;height:18px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(28,37,48,.2);cursor:pointer}
.recap-list .lab{min-width:0;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 6px;font-size:13.5px;font-weight:600}
.recap-list .lab:hover{border-color:var(--side-line)}
.recap-list .lab:focus{border-color:var(--accent);background:var(--white);outline:none}
.scale-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.scale-bar b{color:var(--ink);font-weight:600}
.scale-bar input{width:70px;border:1px solid var(--side-line);border-radius:4px;padding:3px 6px;font:inherit;color:var(--ink);background:var(--white)}
.scale-bar input:focus{border-color:var(--accent);outline:none}
.recap-list li .prop{grid-column:3/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;padding-left:6px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--side-line);border-radius:5px;overflow:hidden;background:var(--white)}
.seg button{border:0;background:transparent;padding:2px 9px;font:inherit;font-size:11.5px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--side-line)}
.seg button.on{background:var(--accent);color:#fff}
.prop .qty{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.prop .why{color:var(--muted);font-size:11.5px}
.use-leg{border-top:1px solid var(--side-line)}
.use-leg .leg2-page{text-transform:none;letter-spacing:0;font-size:12px}
.leg2-state{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600}
.leg2-state.wait{color:var(--gold)}
.leg2-state.ok{color:#1f7a3d}
.use-body{background:var(--white);padding:12px 14px;min-height:90px;display:flex;justify-content:center;align-items:center}
.use-crop{display:flex;justify-content:center;align-items:center;min-width:0}
.use-body.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.use-sel{min-width:0;border-left:1px solid var(--side-line);padding-left:18px}
.use-list .nm{min-width:0;font-size:13.5px;font-weight:600;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 6px;margin-left:-6px;text-overflow:ellipsis}
.use-list .nm:hover{border-color:var(--side-line)}
.use-list .nm:focus{border-color:var(--accent);background:var(--white);outline:none}
.use-list .uq{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:900px){.use-body.split{grid-template-columns:minmax(0,1fr)}.use-sel{border-left:0;padding-left:0;border-top:1px solid var(--side-line);padding-top:12px}}

.crop-body{display:flex;justify-content:center}

.leg-view .msg{color:var(--muted);font-size:13px;line-height:1.5}
.view{position:relative}
.pane-h .grow{flex:1}
.full-btn{display:inline-flex;align-items:center;gap:5px}
.full-btn svg{width:13px;height:13px}

@media (max-width:900px){.box-body{grid-template-columns:minmax(0,1fr)}.pane.legend{border-left:0;border-top:1px solid var(--side-line);contain:none}.leg-view{max-height:60vh}}
.box{background:linear-gradient(170deg,var(--white) 0%,var(--w1) 70%,var(--w2) 100%);border:1px solid var(--side-line);border-radius:8px;box-shadow:0 2px 14px rgba(28,37,48,.06);min-width:0;overflow:hidden}
.box-h{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--side-line)}

.box-h h4{flex:1;min-width:0;margin:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* L'encadré prend les proportions du plan affiché (--ar), A paysage (√2) en attendant */

@media (max-width:720px){

  .app.has-p.folded .rail{flex-direction:row;height:auto;justify-content:flex-start;padding-inline:16px}

<div class="app">
  <nav class="side side1" aria-label="Projets">
    <button class="rail" id="unfold" title="Afficher les projets" aria-label="Afficher les projets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      <span>Projets</span>
    </button>
    <button class="rail-sync" id="railSync" type="button" title="Synchroniser mes appareils" aria-label="Synchroniser mes appareils"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5z"/></svg></button>
    <div class="side-top"><h1>Métré BTP</h1>
      <button class="ico fold" id="fold" title="Réduire le bandeau des projets" aria-label="Réduire le bandeau des projets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <div class="label">Projets</div>
    <ul class="list" id="list"></ul>
    <div class="new">
      <form id="form">
        <input id="name" placeholder="Nom du nouveau projet" aria-label="Nom du nouveau projet" autocomplete="off">
        <button class="btn" type="submit">+ Nouveau projet</button>
      </form>
    </div>
    <div class="sync"><button class="sync-btn" id="syncBtn" type="button" title="Retrouver projets et plans sur tous vos appareils">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5z"/></svg>
      <span id="syncTxt">Synchroniser mes appareils</span></button></div>
  </nav>
  <dialog class="sync-dlg" id="syncDlg"></dialog>
  <nav class="side side2" id="side2" aria-label="Travaux du projet" hidden>
    <div class="eyebrow">Projet</div>
    <h2 class="pname" id="side2Title"></h2>
    <div class="label">Travaux</div>
    <ul class="list" id="tlist"></ul>
    <div class="new">
      <form id="tform">
        <input id="tname" placeholder="Nom du nouveau travail" aria-label="Nom du nouveau travail" autocomplete="off">
        <button class="btn" type="submit">+ Nouveau travail</button>
      </form>
    </div>
  </nav>
  <main>
    <h2 id="title"></h2>
    <p id="sub"></p>
    <div class="nowork" id="noWork" hidden>Créez ou sélectionnez un travail dans le bandeau « Travaux ». Chaque travail a ses propres plans et données, séparés des autres travaux.</div>
    <section class="plan" id="plan" aria-labelledby="planTitle" hidden>
      <div class="plan-h"><h3 id="planTitle">Plan de base</h3><small id="planCount"></small></div>
      <label class="drop" id="drop" for="planIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <b>Glissez vos plans ici</b>
        <span>ou cliquez pour choisir des fichiers · images (PNG, JPG), PDF ou DWG</span>
      </label>
      <input id="planIn" type="file" accept="image/*,application/pdf,.pdf,.dwg,.png,.jpg,.jpeg" multiple hidden>
      <div class="err" id="planErr" hidden></div>
    </section>
    <div class="boxes" id="plans"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(function(){
  const KEY='metre-btp-projets';
  let state={projects:[],current:null};
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.projects))state=s}catch(e){}
  const syncHook={};   // branché par la synchronisation en ligne (plus bas)
  const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
  const save=()=>{saveLocal();syncHook.state?.()};
  const list=document.getElementById('list');

  const STAR='<svg viewBox="0 0 24 24" fill="FILL" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z"/></svg>';
  const TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
  const ROT_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>';
  const ROT_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.34-5.66"/><path d="M4 4v5h5"/></svg>';
  const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const FULL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const EXIT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  let confirmId=null;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const newId=()=>Math.random().toString(36).slice(2,10);
  const curProject=()=>state.projects.find(x=>x.id===state.current);

  /* Liste commune aux projets et aux travaux : favoris en haut, suppression confirmée */
  const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
  let editingId=null;
  function renderList(el,items,curId,{what,empty,open,remove,rename}){
    el.innerHTML='';
    if(!items.length){el.innerHTML=`<li class="none">${empty}</li>`;return}
    const favs=items.filter(p=>p.fav), others=items.filter(p=>!p.fav);
    const rows=[...favs,...(favs.length&&others.length?[null]:[]),...others];
    rows.forEach(p=>{
      const li=document.createElement('li');
      if(!p){li.className='sep';li.setAttribute('role','separator');el.appendChild(li);return}
      if(p.id===confirmId){
        li.className='confirm';
        li.innerHTML=`<span>Supprimer « ${esc(p.name)} » ?</span><div class="row"><button class="sm danger" data-a="yes">Supprimer</button><button class="sm" data-a="no">Annuler</button></div>`;
        li.querySelector('[data-a=yes]').onclick=()=>{confirmId=null;remove(p);save();render()};
        li.querySelector('[data-a=no]').onclick=()=>{confirmId=null;render()};
        el.appendChild(li);return;
      }
      if(rename&&p.id===editingId){
        li.className='editing';
        li.innerHTML=`<input value="${esc(p.name)}" aria-label="Nouveau nom">`;
        const inp=li.querySelector('input');let done=false;
        const finish=ok=>{if(done)return;done=true;const v=inp.value.trim();if(ok&&v)p.name=v;editingId=null;save();render()};
        inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();finish(true)}else if(e.key==='Escape')finish(false)};
        inp.onblur=()=>finish(true);
        el.appendChild(li);setTimeout(()=>{inp.focus();inp.select()});return;
      }
      if(p.id===curId)li.className='cur';
      li.innerHTML=`<button class="open" aria-current="${p.id===curId}"${rename?' title="Double-clic pour renommer"':''}>${esc(p.name)}</button>
        ${rename?`<button class="ico ren" title="Renommer" aria-label="Renommer ${esc(p.name)}">${PEN}</button>`:''}
        <button class="ico fav${p.fav?' on':''}" aria-pressed="${!!p.fav}" title="${p.fav?'Retirer des favoris':'Mettre en favori'}" aria-label="${p.fav?'Retirer des favoris':'Mettre en favori'}">${STAR.replace('FILL',p.fav?'currentColor':'none')}</button>
        <button class="ico del" title="Supprimer ${what}" aria-label="Supprimer ${what}">${TRASH}</button>`;
      li.querySelector('.open').onclick=e=>{
        if(rename&&e.detail>=2){confirmId=null;editingId=p.id;render();return}   // double-clic : renommer
        if(p.id===curId&&!confirmId)return;
        confirmId=null;open(p);save();render()};
      li.querySelector('.fav').onclick=()=>{p.fav=!p.fav;save();render()};
      li.querySelector('.del').onclick=()=>{confirmId=p.id;render()};
      if(rename){
        const startEdit=()=>{confirmId=null;editingId=p.id;render()};
        li.querySelector('.ren').onclick=startEdit;
      }
      el.appendChild(li);
    });
  }

  function render(){
    renderList(list,state.projects,state.current,{
      what:'le projet',empty:'Aucun projet pour l\'instant.',
      open:p=>{state.current=p.id;state.folded=true},
      remove:p=>{deletePlansOf(p.id);state.projects=state.projects.filter(x=>x!==p);if(state.current===p.id)state.current=state.projects[0]?.id||null}
    });
    const p=curProject();
    const app=document.querySelector('.app');
    app.classList.toggle('has-p',!!p);app.classList.toggle('folded',!!state.folded);
    document.getElementById('side2').hidden=!p;
    if(p){
      p.travaux=p.travaux||[];
      document.getElementById('side2Title').textContent=p.name;
      renderList(document.getElementById('tlist'),p.travaux,p.curTravail,{
        what:'le travail',empty:'Aucun travail pour ce projet.',
        open:t=>{p.curTravail=t.id},rename:true,
        remove:t=>{deletePlansOfTravail(t.id);p.travaux=p.travaux.filter(x=>x!==t);if(p.curTravail===t.id)p.curTravail=p.travaux[0]?.id||null}
      });
    }
    const t=p&&p.travaux.find(x=>x.id===p.curTravail);
    document.getElementById('title').textContent=p?p.name:'Aucun projet sélectionné';
    document.getElementById('sub').textContent=!p?'Créez un projet dans la bande de gauche.'
      :(t?'Travail : '+t.name:'Aucun travail sélectionné')+' · Créé le '+new Date(p.created).toLocaleDateString('fr-FR');
    // Tout le contenu de travail (plans…) appartient au travail sélectionné, jamais au projet
    document.getElementById('plan').hidden=!t;
    document.getElementById('noWork').hidden=!p||!!t;
    const key=t?t.id:null;
    if(key!==shownTid){shownTid=key;renderPlans()}
  }
  let shownTid;
  const curTravail=()=>{const p=curProject();return p&&(p.travaux||[]).find(x=>x.id===p.curTravail)};

  /* ---- Plans : fichiers stockés par travail dans IndexedDB ---- */
  let dbP=null;
  function db(){
    if(!dbP)dbP=new Promise((res,rej)=>{
      try{const r=indexedDB.open('metre-btp',2);
        r.onupgradeneeded=e=>{
          const s=e.oldVersion<1?r.result.createObjectStore('plans',{keyPath:'id'}):r.transaction.objectStore('plans');
          if(e.oldVersion<1)s.createIndex('project','projectId');
          if(e.oldVersion<2)s.createIndex('travail','travailId');
        };
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}
    });
    return dbP;
  }
  async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('plans',mode);const out=fn(t.objectStore('plans'));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})}
  const plansOfProject=pid=>tx('readonly',s=>s.index('project').getAll(pid)).catch(()=>[]);
  const plansOfTravail=tid=>tx('readonly',s=>s.index('travail').getAll(tid)).catch(()=>[]);
  const getPlan=id=>tx('readonly',s=>s.get(id)).catch(()=>null);
  const allPlans=()=>tx('readonly',s=>s.getAll()).catch(()=>[]);
  const putPlan=rec=>tx('readwrite',s=>s.put(rec));
  const delPlanLocal=id=>tx('readwrite',s=>s.delete(id));
  // toute modification d'un plan est datée puis envoyée en ligne si la synchronisation est active
  const addPlan=rec=>{rec.stamp=Date.now();return putPlan(rec).then(x=>{syncHook.plan?.(rec.id);return x})};
  const delPlan=id=>delPlanLocal(id).then(x=>{syncHook.plan?.(id);return x});
  async function deletePlansOf(pid){for(const r of await plansOfProject(pid))await delPlan(r.id).catch(()=>{})}
  async function deletePlansOfTravail(tid){for(const r of await plansOfTravail(tid))await delPlan(r.id).catch(()=>{})}
  // Plans ajoutés avant la séparation par travail : rattachés au premier travail du projet
  async function adoptLegacy(p){
    const first=p.travaux[0];if(!first)return;
    for(const r of await plansOfProject(p.id))if(!r.travailId){r.travailId=first.id;await addPlan(r).catch(()=>{})}
  }

  const plansEl=document.getElementById('plans'),errEl=document.getElementById('planErr');
  let urls=[],renderSeq=0;
  const size=n=>n<1048576?Math.round(n/1024)+' Ko':(n/1048576).toFixed(1).replace('.',',')+' Mo';
  async function renderPlans(){
    const seq=++renderSeq;const p=curProject(),t=curTravail();
    if(p&&t)await adoptLegacy(p);
    const recs=t?(await plansOfTravail(t.id)).sort((a,b)=>a.added-b.added):[];
    if(seq!==renderSeq)return;
    urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
    document.getElementById('planCount').textContent=recs.length?recs.length+(recs.length>1?' plans':' plan'):'';
    plansEl.innerHTML='';
    recs.forEach(r=>{
      const isImg=r.type.startsWith('image/'),dwg=!!r.dwg;
      const box=document.createElement('section');box.className='box';
      box.innerHTML=`<header class="box-h">
          <span class="kind${isImg||dwg?'':' pdf'}">${isImg?'IMAGE':dwg?'DWG':'PDF'}</span>
          <h4 title="${esc(r.name)}">${esc(r.name)}</h4><small>${size(r.size)}</small>
          <button class="ico rot" data-r="-90" title="Pivoter à gauche (90°)" aria-label="Pivoter à gauche">${ROT_L}</button>
          <button class="ico rot" data-r="90" title="Pivoter à droite (90°)" aria-label="Pivoter à droite">${ROT_R}</button>
          <button class="ico del" title="Retirer ce plan" aria-label="Retirer ce plan">${TRASH}</button>
        </header>
        <div class="box-body">
          <div class="pane">
            <div class="pane-h"><b>Aperçu</b><span class="grow"></span>
              <button class="sm ocg-btn" hidden title="Afficher ou masquer la liste des calques pour geler ceux que vous ne voulez pas">Calques</button>
              <button class="sm excl-pick" title="Tracer sur le plan une zone à ne pas compter (partie de vue en double, cartouche…)">Exclure une zone</button>
              <button class="sm full-btn" title="Afficher le plan en plein écran (Échap pour quitter)">${FULL} Plein écran</button></div>
            <div class="view"><span class="msg">Chargement du plan…</span></div>
            <div class="pager" hidden><button class="sm pg-prev" title="Page précédente">‹</button><b></b><button class="sm pg-next" title="Page suivante">›</button><small>Molette sur le plan : zoom</small></div>
            <div class="excl-bar" hidden></div>
            <div class="ocg-bar" hidden></div>
          </div>
          <div class="pane legend">
            <div class="pane-h"><b>Légende manuelle</b><span class="leg-page"></span>
              <button class="sm leg-pick"></button><button class="sm leg-clear" hidden>Effacer</button></div>
            <div class="leg-view"></div>
          </div>
        </div>
        <div class="use-leg">
          <div class="pane-h"><b>Légende automatique</b><span class="leg2-page"></span><span class="grow"></span>
            <span class="leg2-state"></span>
            <button class="sm leg2-ok primary-sm" hidden title="Utiliser cette légende pour nommer le récapitulatif">Valider</button>
            <button class="sm leg2-pick"></button><button class="sm leg2-clear" hidden>Effacer</button></div>
          <div class="use-body"><div class="use-crop"></div>
            <div class="use-sel" hidden><div class="sub-h"><b>Sélection des zones</b><span class="use-info"></span></div>
              <div class="sel-bar"><label class="mk" title="Le marquage (traits blancs, noirs ou gris, et lignes de légende nommées « marquage » ou « signalisation ») posé sur une surface est compté dans cette surface"><input type="checkbox" class="use-mark"> Compter le marquage dans les surfaces</label><span class="sel-info"></span><button class="sm use-merge primary-sm" hidden title="Regrouper les lignes cochées en une seule">Grouper</button></div>
              <ul class="recap-list use-list"></ul></div></div>
        </div>
        <div class="struct">
          <div class="pane-h"><b>Structure</b><span class="grow"></span><span class="struct-info"></span></div>
          <ul class="struct-list"></ul>
        </div>`;
      ['.pane.legend','.use-leg','.struct'].forEach(q=>addFold(box.querySelector(q),q.replace(/\W/g,'')));
      box.querySelector('.del').onclick=async()=>{await delPlan(r.id).catch(()=>{});renderPlans()};
      plansEl.appendChild(box);
      const view=box.querySelector('.view');
      const api=isImg?showImg(r,view):dwg?showDwg(r,view):showPdf(r,view,box.querySelector('.pager'));
      const legend=setupLegend(r,box,view,api);
      box.querySelectorAll('.rot').forEach(b=>b.onclick=()=>{
        r.rot=(((r.rot||0)+Number(b.dataset.r))%360+360)%360;
        addPlan(r).catch(()=>{});api.redraw();legend.render();
      });
      const fs=setupFullscreen(box.querySelector('.pane'),box.querySelector('.full-btn'),api);
      if(dwg)setupLayers(r,box,api,legend,fs);   // liste des calques : DWG seulement
    });
  }

  /* Flèche devant le titre d'une partie : replie / déplie la partie (choix gardé dans ce navigateur) */
  function addFold(sec,key){
    const h=sec&&sec.querySelector(':scope>.pane-h,:scope>.ocg-h');if(!h)return;
    const b=document.createElement('button');b.className='sfold';b.innerHTML=CHEV;
    const k='mbtp-fold-'+key;let f=false;try{f=localStorage.getItem(k)==='1'}catch(e){}
    const set=v=>{sec.classList.toggle('fold-off',v);b.title=v?'Déplier cette partie':'Replier cette partie';b.setAttribute('aria-expanded',String(!v));
      try{v?localStorage.setItem(k,'1'):localStorage.removeItem(k)}catch(e){}};
    b.onclick=e=>{e.stopPropagation();set(!sec.classList.contains('fold-off'))};
    h.insertBefore(b,h.firstChild);set(f);
  }

  /* ---- Calques du PDF (contenu optionnel) ou du DWG : liste affichée sous l'aperçu (sur le côté
     en plein écran) ; décocher un calque le gèle. Un calque gelé disparaît de l'aperçu et des
     analyses (légendes, surfaces). Choix mémorisé avec le plan (r.ocg). ---- */
  async function setupLayers(r,box,api,legend,fs){
    const btn=box.querySelector('.ocg-btn'),bar=box.querySelector('.ocg-bar'),pane=box.querySelector('.pane');
    const list=await api.layers().catch(()=>[]);
    if(!list.length||!box.isConnected)return;
    btn.hidden=false;bar.hidden=false;
    bar.innerHTML=`<div class="ocg-h"><b></b></div>
      <div class="ocg-f"><input type="search" placeholder="Rechercher un calque…">
        <button class="sm ocg-all" title="Dégeler les calques affichés dans la liste">Tout afficher</button>
        <button class="sm ocg-off" title="Geler les calques affichés dans la liste">Tout geler</button></div>
      <div class="ocg-l"></div>`;
    const head=bar.querySelector('.ocg-h b'),q=bar.querySelector('input'),ul=bar.querySelector('.ocg-l');
    addFold(bar,'calques');
    const apply=()=>{addPlan(r).catch(()=>{});api.redraw();legend.render();fill()};
    const shown=()=>{const t=q.value.trim().toLowerCase();return api.layersNow().filter(g=>!t||g.name.toLowerCase().includes(t))};
    const setAll=(L,v)=>{L.forEach(g=>api.setLayer(g.id,v));apply()};
    const fill=()=>{
      const L=api.layersNow(),off=L.filter(g=>!g.visible).length;
      btn.textContent='Calques ('+(off?off+' gelé'+(off>1?'s':'')+' / '+L.length:L.length)+')';
      head.textContent=`Calques : ${L.length-off} affiché${L.length-off>1?'s':''} sur ${L.length}`;
      const S=shown();ul.innerHTML='';
      if(!S.length)ul.innerHTML='<div class="ocg-none">Aucun calque ne correspond.</div>';
      S.forEach(g=>{
        const lab=document.createElement('label');lab.className=g.visible?'':'off';lab.title=g.name;
        lab.innerHTML=`<input type="checkbox"${g.visible?' checked':''}>${g.c?`<span class="sw" style="background:${esc(g.c)}"></span>`:''}<span>${esc(g.name)}</span><button class="ocg-only" title="N'afficher que ce calque">seul</button>`;
        lab.querySelector('input').onchange=e=>{api.setLayer(g.id,e.target.checked);apply()};
        lab.querySelector('.ocg-only').onclick=e=>{e.preventDefault();api.layersNow().forEach(h=>api.setLayer(h.id,h.id===g.id));apply()};
        ul.appendChild(lab);
      });
    };
    q.oninput=fill;
    bar.querySelector('.ocg-all').onclick=()=>setAll(shown(),true);
    bar.querySelector('.ocg-off').onclick=()=>setAll(shown(),false);
    fill();
    pane.classList.add('ocg-on');   // liste affichée d'office
    btn.onclick=()=>{pane.classList.toggle('ocg-on');if(fs.on())requestAnimationFrame(()=>api.redraw())};
  }

  /* ---- Plein écran de l'aperçu : panneau étendu à toute la fenêtre (+ vrai plein écran si le navigateur l'autorise) ---- */
  function setupFullscreen(pane,btn,api){
    let on=false,cbs=[];
    const set=v=>{
      if(v===on)return;on=v;cbs.forEach(f=>f(on));
      pane.classList.toggle('full',on);document.body.classList.toggle('noscroll',on);
      btn.innerHTML=on?`${EXIT} Quitter le plein écran`:`${FULL} Plein écran`;
      if(on){try{pane.requestFullscreen?.().catch(()=>{})}catch(e){}}
      else if(document.fullscreenElement===pane){try{document.exitFullscreen().catch(()=>{})}catch(e){}}
      requestAnimationFrame(()=>api.redraw());   // nouveau rendu à la taille de l'écran
    };
    btn.onclick=()=>set(!on);
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&on&&!pane.querySelector('.view.picking'))set(false)});
    document.addEventListener('fullscreenchange',()=>{if(on&&document.fullscreenElement!==pane)set(false)});
    return {set,on:()=>on,onChange:f=>cbs.push(f)};
  }

  /* ---- Légende : zone du plan choisie par l'utilisateur, affichée agrandie à droite ----
     La zone est enregistrée en fractions de la page non pivotée, pour rester juste après une rotation. */
  function toUnrot(x,y,rot){return rot===90?[y,1-x]:rot===180?[1-x,1-y]:rot===270?[1-y,x]:[x,y]}
  function toRot(u,v,rot){return rot===90?[1-v,u]:rot===180?[1-u,1-v]:rot===270?[v,1-u]:[u,v]}
  function setupLegend(r,box,view,api){
    const pick=box.querySelector('.leg-pick'),clear=box.querySelector('.leg-clear');
    const lv=box.querySelector('.leg-view'),lp=box.querySelector('.leg-page');
    const pick2=box.querySelector('.leg2-pick'),clear2=box.querySelector('.leg2-clear');
    let picking=null,rtok=0,lastKey='';   // picking : 'legend' (zone de légende) ou 'legend2' (légende à utiliser)
    lv.innerHTML=`<section class="recap"><div class="sub-h"><b>Récapitulatif des surfaces</b><span class="recap-page"></span></div>
      <div class="sel-bar"><span class="sel-info"></span><button class="sm sel-merge primary-sm" hidden title="Regrouper les lignes cochées en une seule">Fusionner</button><button class="sm sel-all" hidden>Tout sélectionner</button><button class="sm sel-none" hidden>Tout désélectionner</button></div>
      <div class="scale-bar"><b>Échelle</b> 1 / <input class="scale-in" type="number" min="1" step="1" placeholder="?" aria-label="Échelle du plan"><span class="scale-info"></span></div>
      <ul class="recap-list"><li class="msg">Analyse du plan…</li></ul></section>
      <section class="man-zones"><div class="sub-h"><b>Zones sélectionnées sur le plan</b><span class="man-info"></span></div><ul class="man-list"><li class="msg">Analyse du plan…</li></ul></section>
      <section class="leg-crop"><div class="sub-h"><b>Extrait de la légende</b></div><div class="crop-body"></div></section>`;
    const cb=lv.querySelector('.crop-body'),rl=lv.querySelector('.recap-list'),rp=lv.querySelector('.recap-page');
    /* Zones du plan choisies à la main : « Sélectionner sur le plan », puis un clic sur une zone colorée
       ajoute sa ligne. Couleurs du plan telles quelles, sans lien avec la légende automatique
       (zones de légende et zones exclues non comptées). r.manZones = clés, r.manLabels = noms. */
    const manList=lv.querySelector('.man-list'),manInfo=lv.querySelector('.man-info');
    let manRes=null;
    function buildMan(zs){
      if(zs)manRes=zs;zs=manRes||[];
      const keys=r.manZones||[],mpp=mPerPx();r.manLabels=r.manLabels||{};
      manList.innerHTML='';manInfo.textContent=picking==='man'?'cliquez sur les zones du plan':keys.length?keys.length+(keys.length>1?' zones':' zone'):'';
      if(!keys.length){manList.innerHTML='<li class="msg">Aucune zone. Cliquez sur « Sélectionner sur le plan », puis sur les zones colorées du plan : chaque clic ajoute la ligne de la zone.</li>';return}
      keys.forEach(k=>{
        const c=zs.find(c=>c.key===k),li=document.createElement('li');
        li.innerHTML=`<span class="sw"${c?` style="background:rgb(${c.rgb.join(',')})"`:''}></span><input class="lab" aria-label="Nom de la zone"><span class="uq"></span>
          <button class="ico del" title="Retirer cette zone" aria-label="Retirer cette zone">${TRASH}</button>`;
        const inp=li.querySelector('.lab'),auto=c?colorName(c.rgb):'Zone';inp.value=r.manLabels[k]??auto;
        inp.onchange=()=>{const v=inp.value.trim();if(v&&v!==auto)r.manLabels[k]=v;else{delete r.manLabels[k];inp.value=auto}addPlan(r).catch(()=>{})};
        const uq=li.querySelector('.uq');
        if(!c)uq.textContent='absente de cette page';
        else if(mpp){const v=c.area*mpp*mpp;uq.textContent='≈ '+fmt(v,v<10?2:1)+' m²'}
        else uq.textContent=fmt(c.pct,1)+' %';
        li.querySelector('.del').onclick=()=>{r.manZones=r.manZones.filter(x=>x!==k);delete r.manLabels[k];addPlan(r).catch(()=>{});buildMan();setBtns()};
        manList.appendChild(li);
      });
    }
    // Clic sur l'aperçu en mode sélection : zone colorée sous le pointeur (ou à quelques pixels)
    function pickZoneAt(e){
      const media=view.querySelector('canvas');if(!media||!manRes||!manRes.px)return;
      const br=media.getBoundingClientRect(),nw=media.width,nh=media.height,fk=Math.min(br.width/nw,br.height/nh);
      const fx=(e.clientX-br.left-(br.width-nw*fk)/2)/(nw*fk),fy=(e.clientY-br.top-(br.height-nh*fk)/2)/(nh*fk);
      if(fx<0||fx>1||fy<0||fy>1)return;
      const [u,v]=toUnrot(fx,fy,r.rot||0),{lab,W,H}=manRes.px;
      const px=Math.min(W-1,u*W|0),py=Math.min(H-1,v*H|0);let j=-1;
      for(let rad=0;rad<=6&&j<0;rad++)for(let dy=-rad;dy<=rad&&j<0;dy++)for(let dx=-rad;dx<=rad;dx++){
        const x=px+dx,y=py+dy;if(x<0||y<0||x>=W||y>=H)continue;const l=lab[y*W+x];if(l>=0){j=l;break}}
      const c=manRes.find(c=>c.j===j);
      if(!c){manInfo.textContent='pas de zone colorée à cet endroit';return}
      r.manZones=r.manZones||[];
      if(!r.manZones.includes(c.key)){r.manZones.push(c.key);addPlan(r).catch(()=>{})}
      buildMan();
    }
    // Deux zones tracées sur le plan : la zone de légende (en-tête du panneau Légende)
    // et la « légende à utiliser » (encadré sous le plan), prioritaire pour nommer les lignes.
    const zones={
      legend:{btn:pick,clr:clear,cb,lp,tok:0,label:'Légende manuelle',
        pickMsg:'Tracez un rectangle autour de la légende sur l\'aperçu à gauche.',
        none:'Aucune zone de légende. Cliquez sur « Sélectionner sur le plan », puis tracez un rectangle autour de la légende : les couleurs du récapitulatif prendront les noms de la légende.'},
      legend2:{btn:pick2,clr:clear2,cb:box.querySelector('.use-crop'),lp:box.querySelector('.leg2-page'),tok:0,label:'Légende automatique',
        pickMsg:'Tracez un rectangle autour de la légende à utiliser sur l\'aperçu.',
        none:'Aucune légende choisie. Cliquez sur « Sélectionner sur le plan », puis tracez un rectangle autour de la légende à utiliser : puis cliquez sur « Valider » : ses libellés serviront en priorité à nommer les lignes du récapitulatif.'}
    };
    /* Zones exclues : parties du plan à ne pas compter (vue répétée en haut et en bas, cartouche…).
       Rectangles en fractions de la page non pivotée, comme la légende ; hachurées sur l'aperçu. */
    const exBtn=box.querySelector('.excl-pick'),exBar=box.querySelector('.excl-bar');
    const exOnPage=()=>(r.excl||[]).filter(e=>(e.page||1)===api.page());
    function renderExcl(){
      exBtn.textContent=picking==='excl'?'Annuler':'Exclure une zone';exBtn.disabled=!!picking&&picking!=='excl';
      const L=r.excl||[];exBar.hidden=!L.length&&picking!=='excl';exBar.innerHTML='';
      if(picking==='excl'){exBar.innerHTML='<span class="msg">Tracez un rectangle sur la partie du plan à ne pas compter.</span>';return}
      if(!L.length)return;
      exBar.insertAdjacentHTML('beforeend','<span class="lbl">Zones exclues :</span>');
      L.forEach((e,i)=>{const b=document.createElement('button');b.className='sm chip';
        b.title='Compter à nouveau cette zone';b.textContent='Zone '+(i+1)+(api.pages()>1?' (p. '+(e.page||1)+')':'')+' ×';
        b.onclick=()=>{r.excl.splice(i,1);if(!r.excl.length)delete r.excl;addPlan(r).catch(()=>{});renderExcl();api.setOverlay(drawExcl);recap(true)};
        exBar.appendChild(b)});
    }
    function drawExcl(cv,win){   // win : partie du plan dessinée dans cv (zoom), plan entier sinon
      const g=cv.getContext('2d'),rot=r.rot||0,v=win||{x:0,y:0,w:1,h:1},W=cv.width/v.w,H=cv.height/v.h;
      exOnPage().forEach(e=>{
        const a=toRot(e.x,e.y,rot),b=toRot(e.x+e.w,e.y+e.h,rot);
        const x=(Math.min(a[0],b[0])-v.x)*W,y=(Math.min(a[1],b[1])-v.y)*H,w=Math.abs(a[0]-b[0])*W,h=Math.abs(a[1]-b[1])*H;
        g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
        g.fillStyle='rgba(255,255,255,.7)';g.fillRect(x,y,w,h);
        g.strokeStyle='rgba(179,38,30,.45)';g.lineWidth=Math.max(1,W/400);
        const st=Math.max(6,W/80);for(let k=-h;k<w;k+=st){g.beginPath();g.moveTo(x+k,y+h);g.lineTo(x+k+h,y);g.stroke()}
        g.restore();g.setLineDash([Math.max(4,W/150),Math.max(3,W/250)]);g.strokeStyle='#b3261e';g.lineWidth=Math.max(1.5,W/500);g.strokeRect(x,y,w,h);g.setLineDash([]);
      });
    }
    api.setOverlay(drawExcl);
    const setBtns=()=>{renderExcl();for(const k in zones){const z=zones[k];
      z.btn.textContent=picking===k?'Annuler':r[k]?'Changer la zone':'Sélectionner sur le plan';
      z.btn.disabled=!!picking&&picking!==k;z.clr.hidden=!!picking||!r[k]}
      // Légende manuelle : le bouton sert à choisir les zones du plan par clic
      pick.textContent=picking==='man'?'Terminer la sélection':'Sélectionner sur le plan';
      pick.disabled=!!picking&&picking!=='man';clear.hidden=!!picking||!(r.manZones||[]).length;
      // Légende à utiliser : prise en compte seulement une fois validée
      const L2=r.legend2,show=!picking&&!!L2;
      ok2.hidden=!show||!!L2.ok;
      st2.className='leg2-state'+(show?L2.ok?' ok':' wait':'');
      st2.textContent=show?L2.ok?'✓ Validée':'À valider':''};
    const ok2=box.querySelector('.leg2-ok'),st2=box.querySelector('.leg2-state');
    ok2.onclick=()=>{if(!r.legend2)return;r.legend2.ok=true;addPlan(r).catch(()=>{});setBtns();recap()};
    async function renderZone(k){
      const z=zones[k],my=++z.tok;
      if(picking===k){z.cb.innerHTML=`<span class="msg">${z.pickMsg}</span>`;return}
      if(!r[k]){z.lp.textContent='';z.cb.innerHTML=`<span class="msg">${z.none}</span>`;return}
      z.cb.innerHTML='<span class="msg">Chargement de la légende…</span>';
      try{const cv=await api.crop(r[k]);if(my!==z.tok)return;z.lp.textContent=api.pages()>1?'page '+r[k].page:'';cv.setAttribute('aria-label',z.label);z.cb.innerHTML='';z.cb.appendChild(cv)}
      catch(e){if(my===z.tok)z.cb.innerHTML='<span class="msg">Impossible d\'afficher la légende.</span>'}
    }
    function render(){setBtns();renderZone('legend');renderZone('legend2');buildUse()}

    /* Légende validée : extrait à gauche, sélection des zones à droite.
       Une ligne par pastille de la légende retrouvée sur le plan, dans l'ordre de la légende ;
       cocher une ligne revient à cocher la ligne correspondante du récapitulatif. */
    const useBody=box.querySelector('.use-body'),useSel=box.querySelector('.use-sel'),useList=box.querySelector('.use-list'),useInfo=box.querySelector('.use-info'),useMerge=box.querySelector('.use-merge'),useMark=box.querySelector('.use-mark');
    useMark.onchange=()=>{r.marquage=useMark.checked;addPlan(r).catch(()=>{});recap(true)};
    // Couleurs de marquage : libellé (couleur ou groupe) contenant marquage / signalisation
    const MARK=/marquage|signali|passage pieton|zebra/;
    const isMark=c=>MARK.test(norm((r.labels||{})[c.key]??c.legendText??''))
      ||(r.groups||[]).some(g=>g.keys.includes(c.key)&&MARK.test(norm((r.labels||{})['g:'+g.id]??'')));
    let holdUse=false;   // pendant le réglage du contraste : ne pas reconstruire la liste (le curseur perdrait la main)
    /* Structure : reprend les zones de la légende à utiliser (mêmes lignes, groupes compris) */
    const stList=box.querySelector('.struct-list'),stInfo=box.querySelector('.struct-info');
    /* Couches par zone (r.layers[clé de ligne] = [{name, ep en cm}]) : volume = surface × épaisseur */
    let stRows=null;
    const areaM2=it=>{const mpp=mPerPx();return mpp?it.members.reduce((s,c)=>s+(c.area||0),0)*mpp*mpp:null};
    const numFr=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:null};
    function buildStruct(rows){
      stRows=rows;stList.innerHTML='';stInfo.textContent=rows&&rows.length?rows.length+(rows.length>1?' zones':' zone'):'';
      if(!rows||!rows.length){stList.innerHTML=`<li class="msg">${rows?'Aucune zone de la légende retrouvée sur cette page du plan.':'Validez une « Légende automatique » pour reprendre ici les différentes zones.'}</li>`;return}
      r.layers=r.layers||{};
      rows.forEach(it=>{
        const li=document.createElement('li'),L=r.layers[it.key]||[];
        const isSurf=it.li?.querySelector('.seg button.on')?.dataset.k!=='ml';
        li.innerHTML=`<div class="zh"><span class="sws">${it.members.map(c=>`<span class="sw" style="background:rgb(${c.rgb.join(',')})"></span>`).join('')}</span><span class="nm"></span><span class="uq"></span></div>
          <div class="layers"></div>
          <div class="zf"><button class="sm add-l">+ Ajouter une couche</button><span class="vt"></span></div>`;
        const nm=li.querySelector('.nm');nm.textContent=nm.title=(r.labels||{})[it.key]??it.auto;
        li.querySelector('.uq').textContent=it.li?.querySelector('.qty')?.textContent||'';
        const lw=li.querySelector('.layers'),vt=li.querySelector('.vt'),A=isSurf?areaM2(it):null;
        const vol=l=>{const e=numFr(l.ep);return A!=null&&e?A*e/100:null};
        const total=()=>{
          if(!L.length){vt.textContent='';return}
          if(!isSurf){vt.textContent='Volume : zone mesurée en linéaire, passez-la en surface';return}
          if(A==null){vt.textContent='Volume : échelle inconnue';return}
          const v=L.reduce((s,l)=>s+(vol(l)||0),0);vt.textContent='Volume total ≈ '+fmt(v,v<10?2:1)+' m³'};
        L.forEach((l,i)=>{
          const row=document.createElement('div');row.className='layer';
          row.innerHTML=`<span class="ln">${i+1}</span><input class="l-name" placeholder="Nom de la couche" aria-label="Nom de la couche ${i+1}">
            <label class="l-ep"><input class="l-ep-in" inputmode="decimal" placeholder="0" aria-label="Épaisseur de la couche ${i+1} en cm"> cm</label>
            <span class="l-vol"></span><button class="ico del" title="Supprimer cette couche" aria-label="Supprimer la couche ${i+1}">${TRASH}</button>`;
          const ni=row.querySelector('.l-name'),ei=row.querySelector('.l-ep-in'),lv2=row.querySelector('.l-vol');
          ni.value=l.name||'';ei.value=l.ep||'';
          const showVol=()=>{const v=vol(l);lv2.textContent=v!=null?'≈ '+fmt(v,v<10?2:1)+' m³':'';total()};
          ni.onchange=()=>{l.name=ni.value.trim();addPlan(r).catch(()=>{})};
          ei.oninput=()=>{l.ep=ei.value.trim();showVol()};
          ei.onchange=()=>addPlan(r).catch(()=>{});
          row.querySelector('.del').onclick=()=>{L.splice(i,1);if(!L.length)delete r.layers[it.key];addPlan(r).catch(()=>{});buildStruct(stRows)};
          showVol();lw.appendChild(row);
        });
        total();
        li.querySelector('.add-l').onclick=()=>{L.push({name:'',ep:''});r.layers[it.key]=L;addPlan(r).catch(()=>{});buildStruct(stRows);
          stList.children[rows.indexOf(it)]?.querySelectorAll('.l-name')[L.length-1]?.focus()};
        stList.appendChild(li);
      });
    }
    function buildUse(){
      if(holdUse)return;
      const on=!picking&&!!(r.legend2&&r.legend2.ok);
      useBody.classList.toggle('split',on);useSel.hidden=!on;if(!on){buildStruct(null);return}
      const tagged=found.filter(c=>c.legendTag==='use').sort((a,b)=>a.legendPos[0]-b.legendPos[0]||a.legendPos[1]-b.legendPos[1]);
      const rows=[];tagged.forEach(c=>{const it=items.find(i=>i.members.includes(c));if(it&&!rows.includes(it))rows.push(it)});
      buildStruct(rows);
      useList.innerHTML='';
      if(!rows.length){useInfo.textContent='';
        useList.innerHTML='<li class="msg">Aucune pastille de couleur trouvée dans la zone tracée. Vérifiez que le rectangle englobe bien les pastilles de la légende (bouton « Changer la zone »).</li>';buildStruct(rows);return}
      rows.forEach(it=>{
        const li=document.createElement('li'),on=(r.selected||[]).includes(it.key);
        li.className=on?'on':'';
        li.innerHTML=`<input type="checkbox" class="pick"${on?' checked':''} aria-label="Sélectionner cette zone">
          <span class="sws">${it.members.map(c=>`<span class="sw" style="background:rgb(${c.rgb.join(',')})"></span>`).join('')}</span>
          <input class="nm" aria-label="Nom de la zone" title="Nom de la zone (modifiable)"><span class="uq"></span>
          <div class="prop">${it.group?'<button class="sm use-split" title="Séparer ce groupe en couleurs individuelles">Dégrouper</button>':''}<span class="seg" role="group" aria-label="Type de mesure"><button data-k="m2" title="Mesure en surface (m²)">Surface</button><button data-k="ml" title="Mesure en linéaire (ml)">Linéaire</button></span>
            <label class="ctr-l"${on?'':' hidden'}>Contraste <input type="range" class="ctr" min="-100" max="100" step="5" value="${(r.contrast||{})[it.key]||0}" title="Contraste de cette zone sur le plan (double-clic : réinitialiser)"></label></div>`;
        const nm=li.querySelector('.nm');nm.value=(r.labels||{})[it.key]??it.auto;
        // renommer : même libellé que dans le récapitulatif (r.labels)
        nm.onchange=()=>{const v=nm.value.trim();r.labels=r.labels||{};if(v&&v!==it.auto)r.labels[it.key]=v;else delete r.labels[it.key];

    /* Récapitulatif : couleurs de remplissage présentes sur la page affichée, avec leur part et leur libellé */

    const LIN=/bordure|caniveau|cloture|fil d.eau|reseau|canalisation|garde.corps|muret|\bmurs?\b|longrine|glissiere|marquage|\bligne|haie|cable|fourreau|gaine|drain|tuyau|conduite|chainette|joint|lineaire|corniche|acrotere|seuil|grillage|rail|barriere|lisse|plinthe|\bml\b/;

    function buildList(){

          </span>
          <div class="prop"><span class="seg" role="group" aria-label="Type de mesure"><button data-k="m2" title="Mesure en surface (m²)">Surface</button><button data-k="ml" title="Mesure en linéaire (ml)">Linéaire</button></span><span class="qty"></span><span class="why"></span></div>`;

        ctr.onchange=()=>addPlan(r).catch(()=>{});
        ctr.ondblclick=()=>{ctr.value=0;ctr.oninput();ctr.onchange()};
        // Choix du type de mesure : cliquer sur la proposition revient au mode automatique

    const selInfo=lv.querySelector('.sel-info'),selAll=lv.querySelector('.sel-all'),selNone=lv.querySelector('.sel-none'),mergeBtn=lv.querySelector('.sel-merge');

    mergeBtn.onclick=()=>merge(items.filter(it=>r.selected.includes(it.key)));

      if(sel.length<2)return;

    function stop(){picking=null;view.classList.remove('picking');view.querySelector('.sel')?.remove();render();buildMan()}
    const startPick=k=>{if(picking===k){stop();return}if(picking)return;picking=k;view.classList.add('picking');render();buildMan();
      if(k==='legend2'||k==='man')view.scrollIntoView({block:'nearest',behavior:'smooth'})};

    clear.onclick=()=>{delete r.manZones;addPlan(r).catch(()=>{});buildMan();setBtns()};
    clear2.onclick=()=>{delete r.legend2;addPlan(r).catch(()=>{});render();recap()};

        const rot=r.rot||0,a=toUnrot(fx0,fy0,rot),b=toUnrot(fx1,fy1,rot);
        const rect={page:api.page(),x:Math.min(a[0],b[0]),y:Math.min(a[1],b[1]),w:Math.abs(a[0]-b[0]),h:Math.abs(a[1]-b[1])};
        if(picking==='excl'){(r.excl=r.excl||[]).push(rect);api.setOverlay(drawExcl)}else r[picking]=rect;

    });
    box.addEventListener('keydown',e=>{if(e.key==='Escape'&&picking)stop()});
    render();recap();
    return {render};
  }

  // Couleur de remplissage : assez saturée, ou teinte pâle (gris bleuté, vert d'eau…) distincte du blanc du papier.
  // Sinon blanc, noir, gris neutre (traits, fond, texte).
  const chroma=(R,G,B)=>Math.max(R,G,B)-Math.min(R,G,B)>=10;
  /* Lignes d'une zone de légende : chaque pastille de couleur et le libellé écrit à sa droite forment une ligne.
     Renvoie [{text, cols:[[r,g,b]…] (couleurs de la pastille), pos:[y,x]}]. */
  function legendEntries(d,W,H,L,texts){
    const zx0=Math.max(0,L.x0|0),zx1=Math.min(W,Math.ceil(L.x1)),zy0=Math.max(0,L.y0|0),zy1=Math.min(H,Math.ceil(L.y1));
    const zw=zx1-zx0,zh=zy1-zy0;if(zw<2||zh<2)return [];

    for(let y=zy0;y<zy1;y++)for(let x=zx0;x<zx1;x++){
      const s=(y-zy0)*zw+(x-zx0);if(seen[s]||!on(x,y))continue;
      const b={x0:x,x1:x,y0:y,y1:y,pix:[]},st=[s];seen[s]=1;
      while(st.length){const q=st.pop(),qx=q%zw+zx0,qy=(q/zw|0)+zy0,i=(qy*W+qx)*4;
        b.pix.push([d[i],d[i+1],d[i+2]]);if(qx<b.x0)b.x0=qx;if(qx>b.x1)b.x1=qx;if(qy<b.y0)b.y0=qy;if(qy>b.y1)b.y1=qy;
        for(const [nx,ny] of [[qx-1,qy],[qx+1,qy],[qx,qy-1],[qx,qy+1]]){
          if(nx<zx0||nx>=zx1||ny<zy0||ny>=zy1)continue;const n=(ny-zy0)*zw+(nx-zx0);
          if(!seen[n]&&on(nx,ny)){seen[n]=1;st.push(n)}}}
      blobs.push(b);
    }
    for(let merged=true;merged;){merged=false;
      for(let a=0;a<blobs.length&&!merged;a++)for(let c=a+1;c<blobs.length;c++){const A=blobs[a],B=blobs[c];
        if(A.x0-2<=B.x1&&B.x0-2<=A.x1&&A.y0-2<=B.y1&&B.y0-2<=A.y1){
          A.x0=Math.min(A.x0,B.x0);A.x1=Math.max(A.x1,B.x1);A.y0=Math.min(A.y0,B.y0);A.y1=Math.max(A.y1,B.y1);
          A.pix=A.pix.concat(B.pix);blobs.splice(c,1);merged=true;break}}}
    const sw=blobs.filter(b=>b.pix.length>=30&&b.x1-b.x0>=3&&b.y1-b.y0>=3);   // pas les filets de couleur
    // pastilles grises (béton, enrobé gris…) : aplat gris uni, entouré ou non d'un trait noir.
    // Les mots du texte forment aussi des taches sombres, mais sans aplat gris qui remplit leur cadre.
    const dark=(x,y)=>{const i=(y*W+x)*4;return d[i+3]>=128&&!chroma(d[i],d[i+1],d[i+2])&&Math.max(d[i],d[i+1],d[i+2])<245};
    const seen2=new Uint8Array(zw*zh);
    for(let y=zy0;y<zy1;y++)for(let x=zx0;x<zx1;x++){
      const s0=(y-zy0)*zw+(x-zx0);if(seen2[s0]||!dark(x,y))continue;
      const b={x0:x,x1:x,y0:y,y1:y,pix:[]},st=[s0];seen2[s0]=1;
      while(st.length){const q=st.pop(),qx=q%zw+zx0,qy=(q/zw|0)+zy0,i=(qy*W+qx)*4;
        b.pix.push([d[i],d[i+1],d[i+2]]);if(qx<b.x0)b.x0=qx;if(qx>b.x1)b.x1=qx;if(qy<b.y0)b.y0=qy;if(qy>b.y1)b.y1=qy;
        for(const [nx,ny] of [[qx-1,qy],[qx+1,qy],[qx,qy-1],[qx,qy+1]]){
          if(nx<zx0||nx>=zx1||ny<zy0||ny>=zy1)continue;const n=(ny-zy0)*zw+(nx-zx0);
          if(!seen2[n]&&dark(nx,ny)){seen2[n]=1;st.push(n)}}}
      const bw=b.x1-b.x0+1,bh=b.y1-b.y0+1;if(bw<8||bh<6)continue;

  /* ---- Synchronisation en ligne (Supabase, offre gratuite) ----

     Plans : une ligne par plan (table metre_plans) + le fichier d'origine dans le stockage « plans ».
     Chaque appareil garde tout en local ; à chaque changement on envoie, au retour sur la page on reçoit.

      h+=`<p>Pour retrouver vos projets sur tous vos appareils, renseignez votre projet Supabase (gratuit) : Paramètres du projet → API.</p>
        <label>Adresse du projet<input name="url" placeholder="https://xxxx.supabase.co" required></label>
        <label>Clé publique (anon)<input name="key" required></label>
        <div class="sync-a"><button class="btn" value="conf">Enregistrer</button><button class="sm" value="close" formnovalidate>Fermer</button></div>`;
    }else if(!user){
      h+=`<p>Connectez-vous avec le même compte sur chaque appareil : projets, travaux et plans s'y retrouvent automatiquement.</p>
        <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
        <label>Mot de passe<input name="pw" type="password" autocomplete="current-password" minlength="6" required></label>
        <div class="sync-a"><button class="btn" value="in">Se connecter</button><button class="sm" value="up">Créer un compte</button><button class="sm" value="close" formnovalidate>Fermer</button></div>`;
    }else{
      h+=`<p>Connecté avec <b>${esc(user.email||'')}</b>.<br>${esc(syncTxt.textContent)}.</p>
        <div class="sync-a"><button class="btn" value="now">Synchroniser maintenant</button><button class="sm" value="out">Se déconnecter</button><button class="sm" value="close">Fermer</button></div>`;
    }
    h+=`<div class="err sync-e"${msg?'':' hidden'}>${esc(msg||'')}</div></form>`;
    dlg.innerHTML=h;
    const f=dlg.querySelector('form');
    f.onsubmit=async e=>{
      const a=e.submitter?.value;if(a==='close')return;
      e.preventDefault();
      const v=n=>f.elements[n]?.value.trim();
      try{
        if(a==='conf'){sm.conf={url:v('url').replace(/\/+$/,''),key:v('key')};saveSm();await initSync();fillDlg();return}
        if(a==='in'||a==='up'){
          const r=a==='in'?await sb.auth.signInWithPassword({email:v('email'),password:f.elements.pw.value})
            :await sb.auth.signUp({email:v('email'),password:f.elements.pw.value,options:{emailRedirectTo:location.href.split('#')[0]}});
          if(r.error)throw r.error;
          if(a==='up'&&!r.data.session){fillDlg('Compte créé : ouvrez le lien reçu par e-mail pour le confirmer, puis connectez-vous.');return}
          user=r.data.user;showSync();syncNow();dlg.close();return}
        if(a==='now'){syncNow();return}
        if(a==='out'){await sb.auth.signOut();user=null;showSync();dlg.close();return}
      }catch(err){
        const m=String(err?.message||err);
        fillDlg(/invalid login/i.test(m)?'E-mail ou mot de passe incorrect.':/already registered/i.test(m)?'Un compte existe déjà avec cet e-mail : connectez-vous.'
          :/not confirmed/i.test(m)?'Confirmez d\'abord votre adresse avec le lien reçu par e-mail.':'Erreur : '+m)}
    };
  }
  syncBtn.onclick=railSync.onclick=()=>{fillDlg();dlg.showModal()};
  initSync();

  render();
})();
</script>
